name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --no-fail-fast

  wheels:
    name: Wheel ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, manylinux: "", test: true }
          # Cross-built on the arm64 runner; there is no x86_64 Python here to smoke-test it.
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin, manylinux: "", test: false }
          - { name: windows-x64, runner: windows-latest, target: x64, manylinux: "", test: true }
    steps:
      - uses: actions/checkout@v4
      # before the build: the abi3 wheel for Windows needs this interpreter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Smoke test the wheel (full Python test suite against the built wheel)
        if: matrix.test
        shell: bash
        run: |
          python -m pip install numpy pytest
          python -m pip install erploc --no-index --find-links dist
          python -m pytest tests/py -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Smoke test the sdist (builds it)
        run: |
          python -m pip install numpy
          python -m pip install dist/*.tar.gz
          python -c "import erploc; print(erploc.__version__, erploc.wall_candidates([[0, 0], [4, 0], [4, 3], [0, 3]], 2.0).shape)"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  cli:
    name: CLI binary ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { name: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v4
      - name: Build the erploc binary
        run: cargo build --release -p erploc-cli --locked
      - name: Smoke test
        shell: bash
        run: |
          bin=target/release/erploc; test -f "$bin" || bin=target/release/erploc.exe
          "$bin" resect --in examples/cli/resect.json > /dev/null
          "$bin" place --in examples/cli/place.json > /dev/null
      - name: Package
        shell: bash
        run: |
          name="erploc-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md "dist/$name/"
          cp -r examples/cli "dist/$name/examples"
          if [ "${{ matrix.ext }}" = zip ]; then
            cp target/release/erploc.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp target/release/erploc "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [wheels, sdist, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag against the crate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$version" = "$crate" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { on = (index($0, "## [" v "]") == 1); next } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $version"; exit 1; }
          cat notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
