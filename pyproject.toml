[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "erploc"
version = "0.1.0"
description = "Self-localisation from a 360 degree camera and planar markers, and marker placement"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Yuki Sakata" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/yukis-git/erploc"

[project.optional-dependencies]
test = ["pytest"]
examples = ["eqar"]
bench = []

[tool.maturin]
manifest-path = "crates/erploc-py/Cargo.toml"
python-source = "crates/erploc-py/python"
module-name = "erploc._erploc"
features = ["extension-module"]
include = [
    { path = "LICENSE-MIT", format = "sdist" },
    { path = "LICENSE-APACHE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
